spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/esg_db
    username: esg_user
    password: esg_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    org.esg: INFO