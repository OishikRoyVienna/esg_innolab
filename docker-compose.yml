services:
  app:
    image: eclipse-temurin:17-jdk-slim   # ← SO ist es richtig!
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "
        apt-get update && apt-get install -y maven &&
        mvn clean compile exec:java -Dexec.mainClass=org.esg.EsgPocApplication -Dexec.classpathScope=compile
      "
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/esg_db
      SPRING_DATASOURCE_USERNAME: esg_user
      SPRING_DATASOURCE_PASSWORD: esg_pass
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: esg_db
      POSTGRES_USER: esg_user
      POSTGRES_PASSWORD: esg_pass
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esg_user -d esg_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg: